name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }} · Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks, client bundle & manifest sync
        run: npm run check

      - name: Run tests with coverage gate
        run: npm run test:coverage

  audit:
    name: Dependency Audit (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (production dependencies)
        shell: bash
        run: |
          npm audit --omit=dev --registry=https://registry.npmjs.org --json > npm-audit.json || true
          node -e "const r=JSON.parse(require('fs').readFileSync('npm-audit.json','utf8')); console.log('Audit vulnerabilities:', JSON.stringify(r?.metadata?.vulnerabilities ?? {}))"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 30
